/* ---------- export / import ---------- */
function inClaude(){return !!(window.claude&&window.claude.use);}
async function saveFile(name,text){
  if(inClaude()){
    var dl=null;try{dl=await window.claude.use('downloads');}catch(e){}
    if(!dl){toast('Export is not available in this view.');return;}
    try{await dl.save({filename:name,data:text});toast('Export ready');}
    catch(e){if(!e||e.code!=='declined')toast('Could not export from this view.');}
    return;
  }
  var blob=new Blob([text],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  toast('Exported');
}
function exportData(){
  var out={app:'referral-pipeline',version:1,exportedAt:new Date().toISOString(),profile:S.profile||{},companies:S.companies,contacts:S.contacts,apps:S.apps};
  saveFile('referral-pipeline-'+today()+'.json',JSON.stringify(out,null,2));
}
function validRec(kind,it){
  if(!it||typeof it!=='object'||typeof it.id!=='string'||!/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(it.id))return false;
  if(kind==='companies')return typeof it.name==='string'&&it.name.trim()!=='';
  if(kind==='contacts')return typeof it.name==='string'&&it.name.trim()!==''&&typeof it.companyId==='string'&&!!STAGE[it.stage];
  return typeof it.title==='string'&&it.title.trim()!==''&&typeof it.companyId==='string'&&!!STATUS[it.status];
}
async function importData(file){
  var txt;try{txt=await file.text();}catch(e){toast('Could not read that file.');return;}
  var obj;try{obj=JSON.parse(txt);}catch(e){toast('That file is not valid JSON.');return;}
  if(!obj||typeof obj!=='object'||obj.app!=='referral-pipeline'){toast('That is not a Referral Pipeline export.');return;}
  var n=0,kinds=['companies','contacts','apps'];
  for(const kind of kinds){
    var list=Array.isArray(obj[kind])?obj[kind]:[];
    for(const it of list){if(validRec(kind,it)){await put(kind,it);n++;}}
  }
  var p=obj.profile;
  if(p&&typeof p==='object'&&(p.me||p.role))await saveProfile({me:String(p.me||''),role:String(p.role||'')});
  toast('Imported '+plural(n,'record'));
}

/* ---------- sync: private GitHub gist ---------- */
var SYNC={token:'',gist:'',at:'',busy:false,err:''},syncT=0,lastSync=0;
var PASSMSG='The synced data was locked with a different passphrase.';
var GIST_FILE='referral-pipeline.json',GIST_DESC='Referral Pipeline data (private)';
function syncOn(){return S.mode==='local'&&!inClaude()&&!!SYNC.token;}
function syncStore(){writeLocal();}
function gh(path,method,body){
  var h={'Accept':'application/vnd.github+json','Authorization':'Bearer '+SYNC.token,'X-GitHub-Api-Version':'2022-11-28'};
  if(body)h['Content-Type']='application/json';
  return fetch('https://api.github.com'+path,{method:method||'GET',headers:h,body:body?JSON.stringify(body):undefined}).then(function(r){
    if(!r.ok){var e=new Error('http '+r.status);e.status=r.status;throw e;}
    return r.json();
  });
}
function blob(){return {app:'referral-pipeline',version:1,savedAt:savedAt,profile:S.profile||{},companies:S.companies,contacts:S.contacts,apps:S.apps};}
async function gistBody(){
  var env=await seal(blob(),VAULT.key);env.app='referral-pipeline';env.version=1;env.enc=true;env.salt=VAULT.salt;env.iter=VAULT.iter;
  if(VAULT.rec.key){var r=await seal(blob(),VAULT.rec.key);r.salt=VAULT.rec.salt;r.iter=VAULT.rec.iter;env.rec=r;}
  var f={};f[GIST_FILE]={content:JSON.stringify(env)};return f;
}
async function unpack(j){
  if(!j||j.app!=='referral-pipeline')return null;
  if(!j.enc)return {data:j,plain:true};
  return {data:await unseal(await keyFor(j.salt,j.iter||310000),j)};
}
function applyBlob(j){
  ['companies','contacts','apps'].forEach(function(k){S[k]=(Array.isArray(j[k])?j[k]:[]).filter(function(it){return validRec(k,it);});});
  var p=j.profile&&typeof j.profile==='object'?j.profile:{};
  S.profile={me:String(p.me||''),role:String(p.role||'')};
  savedAt=j.savedAt||'';writeLocal();schedule();
}
async function findGist(){
  var list=await gh('/gists?per_page=100');
  var g=list.find(function(x){return x.files&&x.files[GIST_FILE];});
  return g?g.id:'';
}
function syncSoon(){if(!syncOn())return;clearTimeout(syncT);syncT=setTimeout(syncNow,1500);}
async function syncNow(){
  if(!syncOn())return;
  if(SYNC.busy){clearTimeout(syncT);syncT=setTimeout(syncNow,1500);return;}
  SYNC.busy=true;SYNC.err='';
  try{
    if(!SYNC.gist)SYNC.gist=await findGist();
    if(!SYNC.gist){
      var made=await gh('/gists','POST',{description:GIST_DESC,public:false,files:await gistBody()});
      SYNC.gist=made.id;
    }else{
      var g=await gh('/gists/'+SYNC.gist),f=g.files&&g.files[GIST_FILE],rm=null,plain=false;
      if(f){
        var txt=f.truncated?await (await fetch(f.raw_url)).text():f.content,j=null;
        try{j=JSON.parse(txt);}catch(e){}
        if(j){try{var u=await unpack(j);if(u){rm=u.data;plain=!!u.plain;}}catch(e){var pe=new Error('passphrase');pe.status='pass';throw pe;}}
      }
      if(!syncOn()){SYNC.busy=false;return;}
      var ra=rm?(rm.savedAt||''):null;
      if(ra!==null&&ra>savedAt){applyBlob(rm);if(plain)await gh('/gists/'+SYNC.gist,'PATCH',{files:await gistBody()});}
      else if(ra===null||ra<savedAt||plain)await gh('/gists/'+SYNC.gist,'PATCH',{files:await gistBody()});
    }
    SYNC.at=new Date().toISOString();lastSync=Date.now();syncStore();
  }catch(e){
    SYNC.err=e.status==='pass'?PASSMSG:e.status===401?'GitHub rejected the token.':(e.status===403||e.status===404)?'GitHub refused the request. Check that the token has the gist permission.':'Could not reach GitHub.';
  }
  SYNC.busy=false;
  if(D&&D.type==='sync'&&!D.connecting)openSync();
  schedule();
}
function syncNote(){
  if(SYNC.err)return 'Sync problem: '+SYNC.err;
  if(SYNC.busy)return 'Syncing…';
  return SYNC.at?'Last synced '+new Date(SYNC.at).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'.':'Not synced yet.';
}
function openSync(){
  D={type:'sync'};
  var on=syncOn(),body;
  if(on){
    body='<div class="db"><p class="sub" style="margin:0">Your pipeline is kept in a private GitHub gist on your account, encrypted with your passphrase so GitHub only stores unreadable text, and merged whenever you open the app. '+esc(syncNote())+'</p>'
     +'<p class="sub">Open this site on another device, choose Add, then Sync across devices, and paste the same token. Use the same passphrase on both devices. If two devices edit before syncing, the most recent save wins.</p></div>'
     +'<footer class="df"><button class="btn primary" data-act="sync-now">Sync now</button><button class="btn" data-act="sync-off">Turn off sync</button><button class="btn" data-act="close">Close</button></footer>';
  }else{
    body='<div class="db"><p class="sub" style="margin:0">Keep your pipeline in a private GitHub gist so it survives clearing your browser and works on every device. Your data is encrypted with your passphrase before it is sent. No server is involved: this page talks to GitHub directly.</p>'
     +'<ol class="sub" style="padding-left:18px;margin:10px 0"><li><a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=Referral%20Pipeline" target="_blank" rel="noopener">Create a classic token</a> with only the <b>gist</b> permission.</li><li>Paste it below. It is stored in this browser only.</li></ol>'
     +fld('s-token','GitHub token',inp('s-token','','password','ghp_…'))+'</div>'
     +'<footer class="df"><button class="btn primary" data-act="save">Turn on sync</button><button class="btn" data-act="close">Cancel</button></footer>';
  }
  showDrawer(dhead('Private GitHub gist','Sync across devices')+body,on?null:'#s-token');
}
async function connectSync(){
  var t=$('#s-token').value.trim();
  if(!t){toast('Paste a token first.');return;}
  SYNC.token=t;SYNC.gist='';SYNC.err='';D.connecting=true;
  toast('Connecting…');
  await syncNow();
  if(SYNC.err===PASSMSG){SYNC.token='';SYNC.gist='';SYNC.err='';syncStore();openSyncRecover(t);return;}
  if(SYNC.err){var m=SYNC.err;SYNC.token='';SYNC.err='';syncStore();if(D&&D.type==='sync')D.connecting=false;toast(m);return;}
  syncStore();closeDrawer();toast('Sync is on');
}
function openSyncRecover(tok){
  D={type:'sync',needRec:true,tok:tok};
  showDrawer(dhead('Private GitHub gist','Restore with recovery code')
   +'<div class="db"><p class="sub" style="margin:0">The synced data was locked with a different passphrase, probably on another device or before you reset it. Enter the recovery code you saved with it. It will replace the data in this browser with the synced copy and lock it with your current passphrase.</p>'
   +fld('s-rec','Recovery code','<input id="s-rec" type="text" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX">')+'</div>'
   +'<footer class="df"><button class="btn primary" data-act="sync-restore">Restore</button><button class="btn" data-act="close">Cancel</button></footer>','#s-rec');
}
async function syncRestore(){
  var code=normCode($('#s-rec').value),tok=D&&D.tok;
  if(code.length<29){toast('Enter the full recovery code.');return;}
  var prev=VAULT.rec;
  try{
    SYNC.token=tok;
    var id=await findGist();
    if(!id)throw new Error('none');
    var g=await gh('/gists/'+id),f=g.files&&g.files[GIST_FILE];
    var j=JSON.parse(f.truncated?await (await fetch(f.raw_url)).text():f.content);
    if(!j.rec)throw new Error('norec');
    VAULT.rec={code:code,salt:j.rec.salt,iter:j.rec.iter,key:null};
    var rkey=await keyFor(j.rec.salt,j.rec.iter,'r'),data;
    try{data=await unseal(rkey,j.rec);}catch(e){VAULT.rec=prev;SYNC.token='';toast('That recovery code did not unlock the synced data.');return;}
    VAULT.rec.key=rkey;SYNC.gist=id;
    applyBlob(data);
    await gh('/gists/'+id,'PATCH',{files:await gistBody()});
    SYNC.at=new Date().toISOString();lastSync=Date.now();
    await writeLocal();closeDrawer();toast('Restored from sync');
  }catch(e){VAULT.rec=prev;SYNC.token='';SYNC.gist='';toast('Could not restore. Check the token and try again.');}
}
function syncOff(){SYNC.token='';SYNC.gist='';SYNC.at='';SYNC.err='';syncStore();closeDrawer();toast('Sync is off. Your data stays in this browser.');schedule();}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&syncOn()&&Date.now()-lastSync>20000)syncNow();});

/* ---------- events ---------- */
function closeMenu(){var m=$('#addmenu');m.hidden=true;$('#addbtn').setAttribute('aria-expanded','false');}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  if(!e.target.closest('.addwrap'))closeMenu();
  if(!t)return;
  if(e.target.closest('a[href]')&&t!==e.target.closest('a[href]'))return;
  var act=t.dataset.act,id=t.dataset.id;
  switch(act){
    case 'tab':UI.tab=t.dataset.tab;try{localStorage.setItem('rp-tab',UI.tab);}catch(x){}renderAll();break;
    case 'add-menu':{var m=$('#addmenu');m.hidden=!m.hidden;t.setAttribute('aria-expanded',String(!m.hidden));break;}
    case 'new-contact':closeMenu();if(D)closeDrawer();openContact(null,t.dataset.company?{companyId:t.dataset.company}:null);break;
    case 'new-job':closeMenu();if(D)closeDrawer();openJob(null,t.dataset.company?{companyId:t.dataset.company}:null);break;
    case 'new-company':closeMenu();if(D)closeDrawer();openCompany(null);break;
    case 'profile':closeMenu();openProfile();break;
    case 'lock':closeMenu();lockNow();break;
    case 'lock-recover':LK={mode:'recover',err:'',busy:false,reset:false};renderAll();break;
    case 'lock-back':LK={mode:'unlock',err:'',busy:false,reset:false};renderAll();break;
    case 'show-recovery':closeMenu();openRecovery(false);break;
    case 'copy-rec':copyVal(VAULT.rec.code);break;
    case 'sync-restore':syncRestore();break;
    case 'lock-reset':LK.reset=true;renderAll();break;
    case 'lock-cancel':LK.reset=false;renderAll();break;
    case 'lock-erase':try{localStorage.removeItem('rp-vault');localStorage.removeItem('rp-data');localStorage.removeItem('rp-sync');}catch(x){}LK={mode:'setup',err:'',busy:false,reset:false};renderAll();break;
    case 'sync':closeMenu();openSync();break;
    case 'sync-now':syncNow();break;
    case 'sync-off':syncOff();break;
    case 'export':closeMenu();exportData();break;
    case 'import':closeMenu();$('#importfile').click();break;
    case 'open-contact':if(D)closeDrawer();openContact(id);break;
    case 'open-job':if(D)closeDrawer();openJob(id);break;
    case 'open-company':if(D)closeDrawer();openCompany(id);break;
    case 'adv':adv(id,t.dataset.to).then(function(){if(D)closeDrawer();});break;
    case 'followup':followup(id).then(function(){if(D)closeDrawer();});break;
    case 'touch':touch(id).then(function(){if(D)closeDrawer();});break;
    case 'snooze':snooze(id,3);break;
    case 'apply':markApplied(id);break;
    case 'ask':if(D)closeDrawer();openAsk(t.dataset.app,t.dataset.contact);break;
    case 'ask-confirm':askConfirm();break;
    case 'copy-draft':copyFrom($('#f-draft',drawer));break;
    case 'copy-subj':copyFrom($('#f-subj',drawer));break;
    case 'copy-email':copyVal(t.dataset.val);break;
    case 'chan':D.channel=t.dataset.ch;D.draftEdited=false;refreshDraft();break;
    case 'wkind':D.wk=parseInt(t.dataset.k,10);D.draftEdited=false;refreshDraft();break;
    case 'email-first':case 'li-first':case 'outfollow':outreach(id,act).then(function(){if(D)closeDrawer();});break;
    case 'copy-ask':copyFrom($('#k-draft',drawer));break;
    case 'use-suggestion':$('#f-next',drawer).value=t.dataset.val;D.nextTouched=true;break;
    case 'add-log':addLog();break;
    case 'jf':UI.jf=t.dataset.f;renderAll();break;
    case 'grp':UI.grp=t.dataset.g;try{localStorage.setItem('rp-grp',UI.grp);}catch(x){}renderAll();break;
    case 'clear-examples':clearExamples();break;
    case 'close':closeDrawer();break;
    case 'save':
      if(!D)break;
      if(D.type==='contact')saveContact();else if(D.type==='job')saveJob();else if(D.type==='company')saveCompany();
      else if(D.type==='sync'){connectSync();}
      else if(D.type==='profile'){saveProfile({me:$('#p-me').value.trim(),role:$('#p-role').value.trim()}).then(function(){closeDrawer();toast('Saved');});}
      break;
    case 'delete':
      if(!t.dataset.armed){t.dataset.armed='1';t.dataset.label=t.textContent;t.textContent='Click again to delete';t.classList.add('armed');setTimeout(function(){if(t.isConnected){delete t.dataset.armed;t.textContent=t.dataset.label;t.classList.remove('armed');}},4000);}
      else doDelete();
      break;
  }
});
scrim.addEventListener('click',closeDrawer);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(!drawer.hidden)closeDrawer();closeMenu();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click();return;}
  if(e.key==='Enter'&&!drawer.hidden&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'&&D&&D.type!=='ask'&&e.target.id!=='f-logn'){e.preventDefault();var b=$('[data-act="save"]',drawer);if(b)b.click();return;}
  if(e.key==='Enter'&&e.target.id==='f-logn'){e.preventDefault();addLog();return;}
  if(e.key==='Tab'&&!drawer.hidden){
    var f=$$('a[href],button:not([disabled]),input,select,textarea',drawer).filter(function(x){return !x.hidden&&x.offsetParent!==null;});
    if(!f.length)return;var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  }
});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='coq'){UI.coq=e.target.value;fillList();}
  else if(id==='cq'){UI.cq=e.target.value;fillList();}

/* ---------- init ---------- */
async function init(){
  renderAll();
  var db=null,uid=null;
  try{
    if(window.claude&&window.claude.use){
      var user=await window.claude.use('user');
      if(user)uid=await user.id();
      db=await window.claude.use('db');
    }
  }catch(e){}
  if(db&&uid){
    S.mode='cloud';S.root=db.doc('data/users/'+uid+'/tracker');
    ['companies','contacts','apps'].forEach(function(k){
      S.root.collection(k).onSnapshot(function(snap){S[k]=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id});});S.loaded[k]=true;schedule();},function(){S.err=true;schedule();});
    });
    S.root.collection('settings').doc('profile').onSnapshot(function(s){S.profile=s.exists?s.data():{};schedule();},function(){});
  }else if(inClaude()){
    S.mode='local';loadLocal();
    var si=$('#syncitem');if(si)si.hidden=true;
  }else{
    S.mode='locked';LK.mode=hasVault()?'unlock':'setup';
  }
  schedule();
}
window.__rp={S:S,cadenceDays:cadenceDays,isCold:isCold,suggestNext:suggestNext,dueInfo:dueInfo,withStage:withStage,addDays:addDays,diff:diff};
init();
